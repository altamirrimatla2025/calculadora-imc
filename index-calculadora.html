<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Calculadora de IMC</title>
</head>
<body class="container mt-4">
  <h1>Calculadora de IMC</h1>
  <form class="form m-2">
   <label for="peso" class="form-label">Peso (Kg)</label>
    <input type="number" id="peso" class="form-control" step="0.1">

    <label for="altura" class="form-label">Altura (m)</label>
    <input type="number" id="altura" class="form-control" step="0.01">
    
    <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
    <a href="#" class="btn btn-secondary m-2" onclick="LIMPAR()"></a>LIMPAR</a>
  </form>
  <div id="resultado" class="alert alert-info mt-3" style="display:none;"></div>

  <script>
    function LIMPAR() {
      document.getElementById('peso').value = '';
      document.getElementById('altura').value = '';
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('peso').classList.remove('is-invalid');
      document.getElementById('altura').classList.remove('is-invalid');
    }
    function executar() {
      
      const pesoInput = document.getElementById('peso');
      const alturaInput = document.getElementById('altura');
      const divResultado = document.getElementById('resultado');
      
      const peso = parseFloat(pesoInput.value);
      const altura = parseFloat(alturaInput.value);

      if (!peso || !altura || peso <= 0 || altura <= 0) {
        pesoInput.classList.add('is-invalid');
        alturaInput.classList.add('is-invalid');    
        alert('Digite peso e altura válidos maiores que zero');
        return;
      } else {
        pesoInput.classList.remove('is-invalid');
        alturaInput.classList.remove('is-invalid'); 
      }

      const imc = peso / (altura * altura);
      let classificacao = '';
      let cor = '';

      if (imc < 18.5) {
      classificacao = 'Abaixo do peso';
      cor = 'alert-info';
      }else if (imc < 25) {
      classificacao = 'Peso normal';
      cor = 'alert-success';
      }else if (imc < 30) {
      classificacao = 'Sobrepeso';
      cor = 'alert-warning';
    }else{
       classificacao = 'Obesidade grau 3';
      cor = 'alert-danger';
    }

    divResultado.className = `alert ${cor} mt-3`;
    divResultado.innerHTML = `seu IMC eh <strong>${imc.toFixed(2)}</strong> - ${classificacao}`;
    divResultado.style.display = 'block';
    }
  </script>
</body>
</html>
