<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Calculadora de IMC</title>
</head>
<body class="container mt-4">
  <h1>Calculadora de IMC</h1>
  <form class="form m-2">
   <label for="peso" class="form-label">Peso (Kg)</label>
    <input type="number" id="peso" class="form-control" step="0.1">

    <label for="altura" class="form-label">Altura (m)</label>
    <input type="number" id="altura" class="form-control" step="0.01">
    
    <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
  </form>
  <div id="resultado" class="alert alert-info mt-3" style="display:none;"></div>

  <script>
    function executar() {
      const peso = parseFloat(document.getElementById('peso').value);
      const altura = parseFloat(document.getElementById('altura').value);
      
      if (!peso || !altura || altura <= 0) {
        alert('Digite valores válidos');
        return;
      }

      const imc = peso / (altura * altura);
      let classificacao;

      if (imc < 18.5) classificacao = 'Abaixo do peso';
      else if (imc < 25) classificacao = 'Peso normal';
      else if (imc < 30) classificacao = 'Sobrepeso';
      else if (imc < 35) classificacao = 'Obesidade grau 1';
      else if (imc < 40) classificacao = 'Obesidade grau 2';
      else classificacao = 'Obesidade grau 3';

      const divResultado = document.getElementById('resultado');
      divResultado.style.display = 'block';
      divResultado.innerText = `IMC: ${imc.toFixed(2)} - ${classificacao}`;
    }
  </script>
</body>
</html>
